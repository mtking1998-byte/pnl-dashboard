services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      # repo mounted read-write so the startup step can write the generated ZIPs into the web root
      - ./:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx.main.conf:/etc/nginx/nginx.conf:ro
    user: root
    # build the downloadable ZIP packages, then serve
    command: ["sh", "-ec", "python3 /usr/share/nginx/html/tools/build-zips.py && exec nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
